kind = "web"
previewPath = "/"
title = "Nimble Nimbus"
description = "A premium creative agency website with a bold editorial voice, a sky-filled visual world, and an expressive portfolio of digital work."
version = "1.0.0"
id = "artifacts/cloudline-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23528

[services.development]
run = "pnpm --filter @workspace/cloudline-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cloudline-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/cloudline-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23528"
BASE_PATH = "/"
